<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Demo AA2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Registro de usuario</h1>
    <p class="subtitle">Complete el formulario para crear una cuenta simulada</p>
    <form id="form-registro" novalidate>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" required>

      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" name="confirmar" type="password" required>

      <p id="mensaje-error" class="mensaje error" role="alert"></p>
      <p id="mensaje-exito" class="mensaje exito" role="status"></p>
      <button type="submit" id="btn-registrar">Registrar</button>
    </form>
    <a class="enlace" href="index.html">Volver al login</a>
  </main>
  <script src="app.js"></script>
</body>
</html>
